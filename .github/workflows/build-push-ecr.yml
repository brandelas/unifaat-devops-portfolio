name: Build and Push to Amazon ECR

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLISH to authorize this ECR publication
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: technova-api

jobs:
  build-and-push:
    name: Manual ECR publication
    runs-on: ubuntu-latest
    environment: ecr-publish
    steps:
      - name: Confirmar autorização explícita
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [[ "$CONFIRM_PUBLISH" != "PUBLISH" ]]; then
            echo 'Publicação cancelada: informe PUBLISH para confirmar.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais temporárias do Learner Lab
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null
          fi

      - name: Build and push image tags
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY"
          sha_tag="sha-${SHORT_SHA:0:7}"
          docker build -f aula-09/technova-api/Dockerfile \
            -t "$image:$sha_tag" -t "$image:latest" aula-09/technova-api
          docker push "$image:$sha_tag"
          docker push "$image:latest"

          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            for tag in "$major.$minor.$patch" "$major.$minor" "$major"; do
              docker tag "$image:$sha_tag" "$image:$tag"
              docker push "$image:$tag"
            done
          fi
