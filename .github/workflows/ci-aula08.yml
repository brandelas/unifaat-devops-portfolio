name: CI Aula 08

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-aula08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: aula-08/technova-api
      - name: Verificar estilo
        run: npm run lint
        working-directory: aula-08/technova-api

  test:
    name: Jest (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: aula-08/technova-api
      - name: Executar testes com coverage
        run: npm run test:ci
        working-directory: aula-08/technova-api

  build:
    name: Docker build e smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirmar secret de teste
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "::warning::Configure AWS_REGION em Settings > Secrets and variables > Actions para completar o requisito de secrets."
          else
            echo "O secret AWS_REGION esta configurado. O valor nao sera exibido."
          fi
      - name: Construir imagem Docker
        run: docker build -t technova-api:${{ github.sha }} ./aula-08/technova-api
      - name: Iniciar container e verificar health check
        env:
          IMAGE: technova-api:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --detach --name technova-api-ci --publish 3000:3000 "$IMAGE"
          cleanup() {
            docker rm --force technova-api-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Health check nao respondeu no tempo esperado."
          docker logs technova-api-ci
          exit 1
